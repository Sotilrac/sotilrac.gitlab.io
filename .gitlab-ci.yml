image: node:22-alpine

variables:
  # Point npm at the cached dir below so --prefer-offline actually hits it.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

stages:
  - verify
  - deploy

# Cache only npm's download cache. node_modules is intentionally not cached:
# `npm ci` wipes it every run, so caching it only moves ~50 MB per pipeline.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  interruptible: true

lint:
  stage: verify
  needs: []
  script:
    - npm ci --prefer-offline --no-audit --fund=false --ignore-scripts
    - npx prettier --check .

test:
  stage: verify
  needs: []
  script:
    - npm ci --prefer-offline --no-audit --fund=false --ignore-scripts
    - node _tools/build-ee-calculator.mjs
    - npx @11ty/eleventy --output=test
    - node _tools/check-internal-links.mjs test
  artifacts:
    paths:
      - test
    expire_in: 1 week
  except:
    - master

pages:
  stage: deploy
  needs:
    - lint
  script:
    - npm ci --prefer-offline --no-audit --fund=false --ignore-scripts
    - node _tools/build-ee-calculator.mjs
    - npx @11ty/eleventy --output=public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  only:
    - master
