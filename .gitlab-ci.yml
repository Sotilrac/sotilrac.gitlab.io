image: node:22-alpine

variables:
  # Point npm at the cached dir below so --prefer-offline actually hits it.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Full history: _data/gitDates.mjs derives each post's updated date from the
  # log. History adds little over the images already in the working tree.
  GIT_DEPTH: "0"

stages:
  - verify
  - deploy

# Cache only npm's download cache. node_modules is intentionally not cached:
# `npm ci` wipes it every run, so caching it only moves ~50 MB per pipeline.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  interruptible: true
  before_script:
    # node:22-alpine ships neither git nor make: gitDates.mjs shells out to
    # `git log`, and every job drives the build through the Makefile.
    - apk add --no-cache git make
    - npm ci --prefer-offline --no-audit --fund=false --ignore-scripts

lint:
  stage: verify
  needs: []
  script:
    - make lint

# Branch builds: build and link-check, nothing to publish.
test:
  stage: verify
  needs: []
  script:
    - make build check-links OUT=test
  except:
    - master

pages:
  stage: deploy
  needs:
    - lint
  script:
    - make build check-links OUT=public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  only:
    - master
