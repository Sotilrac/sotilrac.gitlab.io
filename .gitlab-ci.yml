image: node:22-alpine

stages:
  - lint
  - test
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/

lint:
  stage: lint
  script:
    - npm ci --prefer-offline --no-audit --fund=false --ignore-scripts
    - npx prettier --check .

test:
  stage: test
  script:
    - npm ci --prefer-offline --no-audit --fund=false --ignore-scripts
    - npx @11ty/eleventy --output=test
    - node _tools/check-internal-links.mjs test
  artifacts:
    paths:
      - test
    expire_in: 1 week
  except:
    - master

pages:
  stage: deploy
  script:
    - npm ci --prefer-offline --no-audit --fund=false --ignore-scripts
    - npx @11ty/eleventy --output=public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  only:
    - master
