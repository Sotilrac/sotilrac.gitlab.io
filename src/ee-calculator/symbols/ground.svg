  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10,0 V 15" />
    <path d="M 0,15 H 20" />
    <path d="M 5,20 H 15" />
    <path d="M 8,25 H 12" />
  </g>
</svg>
