

<svg viewBox="0 0 360 360" preserveAspectRatio="xMidYMid meet"
    xmlns="http://www.w3.org/2000/svg" version="1.1">

    <rect width="360" height="360" fill="white"/>

    <!-- wires -->

    <polyline points="20,50 200,50 200,110" 
        style="fill:none;stroke:black;stroke-width:2"/>

    <polyline points="120,150 120,110 280,110 280,150" 
        style="fill:none;stroke:black;stroke-width:2"/>

    <polyline points="120,230 120,270 280,270 280,230" 
        style="fill:none;stroke:black;stroke-width:2"/>

    <polyline points="20,330 200,330 200,270" 
        style="fill:none;stroke:black;stroke-width:2"/>

    <!-- solder joints -->
    <circle cx="200" cy="110" r="3" />
    <circle cx="200" cy="270" r="3" />

    <!-- terminals -->
    <circle cx="20" cy="50" r="3" style="fill:white; stroke:black"  />
    <circle cx="20" cy="330" r="3" style="fill:white; stroke:black"  />

    <!-- terminal voltage labels -->
    <text x="10" y="130" fill="black" font-size="18" style="font-family:Verdana">+</text>
    <text x="10" y="200" fill="black" font-size="18" style="font-family:Verdana;font-style:italic;">v(t)</text>
    <text x="10" y="270" fill="black" font-size="18" style="font-family:Verdana">-</text>

    <!-- terminal current labels -->

    <polygon points="55,50 45,45 45,55" 
        style="fill:black;stroke:black;stroke-width:1"/>

    <text x="50" y="35" fill="black" font-size="18" style="font-family:Verdana;font-style:italic;">i(t)</text>

    <!-- Inductor -->
    <path id="inductor" d="M 120 150  l 0 15   q -40 5 0 10   q -40 5 0 10   
        q -40 5 0 10   q -40 5 0 10  q -40 5 0 10   l 0 15 "
        stroke="black" stroke-width="2" fill="none" />

    <text x="70" y="200" fill="black" font-size="24" style="font-family:Verdana">L</text>

    <!-- Capacitor -->
    <path id="capacitor" d="M 280 150 l 0 35   m -20 0   l 40 0    m 0 10  l -40 0  m 20 0 l 0 35 "
        stroke="black" stroke-width="2" fill="none" />

    <text x="310" y="200" fill="black" font-size="24" style="font-family:Verdana">C</text>

</svg>
