# Press & media mentions.
# Sort handled in templates (newest first).
# Fields:
#   outlet     (required) — publication name
#   date       (required) — YYYY-MM-DD; use first of month if day unknown
#   title      (required) — article/episode title
#   url        (required) — primary link
#   archive    (optional) — wayback or other archive URL
#   screenshot (optional) — path to thumbnail (defaults to outlet name block if missing)
#   thumb_mode (optional) — "cover" (default, image fills) or "logo" (centered, contained, for favicons)
#   blurb      (required) — one short sentence
#   author     (optional) — byline
#   kind       (required) — article | podcast | video | photo | interview
#   post       (optional) — companion blog post URL on this site
#   status     (optional) — "public" (default) or "draft" (hidden from carousel/resume)

